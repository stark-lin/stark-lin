name: Update profile

on:
  push:
    branches:
      - main
  schedule:
  # Primary update window: 00:10–00:55 JST
  # Multiple triggers reduce the chance of a delayed or dropped scheduled run.
  - cron: "10 15 * * *" # 00:10 JST
  - cron: "25 15 * * *" # 00:25 JST
  - cron: "40 15 * * *" # 00:40 JST
  - cron: "55 15 * * *" # 00:55 JST

  # Final fallback in case the primary window is heavily delayed.
  - cron: "10 19 * * *" # 04:10 JST
  
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-waka
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate profile data
        run: python scripts/update_readme.py --check
      - name: Generate today's waka
        run: python scripts/update_readme.py
      - name: Commit updated profile
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "daily waka"
          git push
