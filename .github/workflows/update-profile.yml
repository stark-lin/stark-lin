name: Update profile

on:
  push:
    branches:
      - main
  schedule:
    # 00:10 Asia/Tokyo (JST is UTC+9 and has no daylight-saving time)
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate today's waka
        run: python scripts/update_readme.py
      - name: Commit updated profile
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "daily waka"
          git push
